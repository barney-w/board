name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Validate manifests
        run: |
          for f in projects/*.project.yaml projects/examples/*.project.yaml projects/community/*.project.yaml; do
            [ -f "$f" ] || continue
            echo "Validating $f"
            yq eval '.' "$f" > /dev/null
          done

  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/
      - name: Build Bicep
        run: bicep build infra/main.bicep --stdout > /dev/null
      - name: Lint Bicep
        run: bicep lint infra/main.bicep

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        working-directory: cli
        run: uv sync --all-extras
      - name: Ruff check
        working-directory: cli
        run: uv run ruff check
      - name: Ruff format check
        working-directory: cli
        run: uv run ruff format --check
      - name: Mypy
        working-directory: cli
        run: uv run mypy src/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        working-directory: cli
        run: uv sync --all-extras
      - name: Run tests
        working-directory: cli
        run: uv run pytest tests/unit/ --cov=board --cov-report=term-missing

  crypto-compat:
    name: Cross-Language Crypto Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build extension
        working-directory: extension
        run: npm ci && npm run build:prod
      - name: Install Python deps
        working-directory: cli
        run: uv sync --all-extras
      - name: Run crypto compat test
        working-directory: cli
        run: uv run pytest tests/integration/test_crypto_compat.py -v

  build-extension:
    name: Build & Test Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      - name: Build
        working-directory: extension
        run: npm run build:prod
      - name: Test
        working-directory: extension
        run: npm test
