#cloud-config

hostname: __BOARD_HOSTNAME__

package_update: true

packages:
  # System essentials
  - curl
  - wget
  - git
  - build-essential
  - jq
  - unzip
  - htop
  - tree
  - tmux
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common

  # Editors
  - neovim
  - nano

  # POSIX ACL support (setfacl for Entra ID group access)
  - acl

  # Cockpit (system admin UI — socket-activated, zero overhead when idle)
  - apache2-utils
  - cockpit
  - cockpit-podman

write_files:
  - path: /home/devuser/setup-me.sh
    owner: devuser:devuser
    permissions: "0755"
    defer: true
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Colors
      GREEN='\033[0;32m'
      BLUE='\033[0;34m'
      YELLOW='\033[1;33m'
      RED='\033[0;31m'
      NC='\033[0m'
      BOLD='\033[1m'

      echo ""
      echo -e "${BLUE}${BOLD}╭───────────────────────────────────────────────╮${NC}"
      echo -e "${BLUE}${BOLD}│         Board — First-Time Setup              │${NC}"
      echo -e "${BLUE}${BOLD}╰───────────────────────────────────────────────╯${NC}"
      echo ""

      # ── Step 1: Git identity ──
      echo -e "${BOLD}Step 1: Git Configuration${NC}"
      echo ""

      current_name=$(git config --global user.name 2>/dev/null || echo "")
      current_email=$(git config --global user.email 2>/dev/null || echo "")

      if [[ -n "$current_name" && -n "$current_email" ]]; then
          echo -e "  Git already configured: ${GREEN}$current_name <$current_email>${NC}"
          read -rp "  Change it? (y/N): " change_git
          if [[ "$change_git" != "y" && "$change_git" != "Y" ]]; then
              echo "  Keeping existing config."
          else
              current_name=""
          fi
      fi

      if [[ -z "$current_name" ]]; then
          read -rp "  Your full name (e.g. Jane Bloggs): " git_name
          read -rp "  Your email: " git_email
          git config --global user.name "$git_name"
          git config --global user.email "$git_email"
          echo -e "  ${GREEN}✓ Git configured: $git_name <$git_email>${NC}"
      fi
      echo ""

      # ── Step 2: SSH key ──
      echo -e "${BOLD}Step 2: SSH Key${NC}"
      echo ""

      if [[ -f ~/.ssh/id_ed25519 ]]; then
          echo -e "  ${GREEN}✓ SSH key already exists.${NC}"
          echo "  Public key:"
          echo ""
          echo -e "  ${YELLOW}$(cat ~/.ssh/id_ed25519.pub)${NC}"
          echo ""
      else
          read -rp "  Generate an SSH key for Git hosting? (Y/n): " gen_key
          if [[ "$gen_key" != "n" && "$gen_key" != "N" ]]; then
              email=$(git config --global user.email)
              ssh-keygen -t ed25519 -C "$email" -f ~/.ssh/id_ed25519 -N ""
              echo ""
              echo -e "  ${GREEN}✓ SSH key generated.${NC}"
              echo "  Public key (copy this into your Git host → Settings → SSH Keys):"
              echo ""
              echo -e "  ${YELLOW}$(cat ~/.ssh/id_ed25519.pub)${NC}"
              echo ""

              eval "$(ssh-agent -s)" > /dev/null 2>&1
              ssh-add ~/.ssh/id_ed25519 2>/dev/null
          else
              echo "  Skipping key generation."
          fi
      fi
      echo ""

      # ── Step 3: GitHub authentication ──
      echo -e "${BOLD}Step 3: GitHub Authentication${NC}"
      echo ""

      if gh auth status &>/dev/null 2>&1; then
          echo -e "  ${GREEN}✓ Already authenticated with GitHub.${NC}"
      else
          echo "  GitHub CLI authentication enables Copilot and repo access."
          read -rp "  Authenticate with GitHub now? (Y/n): " do_gh_auth
          if [[ "$do_gh_auth" != "n" && "$do_gh_auth" != "N" ]]; then
              gh auth login
              if gh auth status &>/dev/null 2>&1; then
                  echo -e "  ${GREEN}✓ GitHub authenticated.${NC}"
                  # Install Copilot extension if not already present
                  gh extension install github/gh-copilot 2>/dev/null || true
              else
                  echo -e "  ${YELLOW}Authentication skipped or failed. Run 'gh auth login' later.${NC}"
              fi
          else
              echo "  Skipping. Run 'gh auth login' when you're ready."
          fi
      fi
      echo ""

      # ── Step 4: Tool verification ──
      echo -e "${BOLD}Step 4: Verifying Tools${NC}"
      echo ""

      tools=(
          "git:git --version"
          "Python:python3 --version"
          "uv:uv --version"
          "Node.js:node --version"
          "npm:npm --version"
          "pnpm:pnpm --version"
          "Docker:docker --version"
          "Docker Compose:docker compose version"
          "Azure CLI:az version --query '\"azure-cli\"' -o tsv"
          "just:just --version"
          "neovim:nvim --version | head -1"
          "GitHub CLI:gh --version | head -1"
          "GitHub Copilot CLI:gh copilot --version 2>/dev/null | head -1"
          "jq:jq --version"
      )

      pass=0
      fail=0

      for tool in "${tools[@]}"; do
          name="${tool%%:*}"
          cmd="${tool#*:}"
          if output=$(eval "$cmd" 2>&1); then
              echo -e "  ${GREEN}✓${NC} $name → $output"
              pass=$((pass + 1))
          else
              echo -e "  ${RED}✗${NC} $name → not found or failed"
              fail=$((fail + 1))
          fi
      done

      echo ""

      echo -e "  Checking Docker runs without sudo..."
      if docker run --rm hello-world &>/dev/null; then
          echo -e "  ${GREEN}✓${NC} Docker works without sudo"
          pass=$((pass + 1))
      else
          echo -e "  ${RED}✗${NC} Docker requires sudo — try logging out and back in"
          fail=$((fail + 1))
      fi

      echo ""
      echo -e "  ${BOLD}Results: ${GREEN}$pass passed${NC}, ${RED}$fail failed${NC}"
      echo ""

      # ── Step 5: Quick orientation ──
      echo -e "${BOLD}Step 5: Your Workspace${NC}"
      echo ""
      if [[ -d ~/projects/.board ]]; then
          echo "  Your projects are ready. Run 'check' to verify services are healthy"
          echo ""
          echo ""
          echo "  Useful commands:"
          echo "    check         -> verify all services are running"
          echo "    gs             -> git status"
          echo "    dc up          -> docker compose up"
      else
          echo "  Your project directory: ~/projects"
          echo "  To clone a repo:        cd ~/projects && git clone <url>"
          echo ""
          echo "  Useful commands:"
          echo "    gs            -> git status"
          echo "    dc up         -> docker compose up"
          echo "    dc down       -> docker compose down"
      fi

      # Browser IDE access
      echo ""
      echo -e "${BOLD}Browser IDE Access${NC}"
      echo ""
      if [[ -f ~/.board/tunnel-url ]]; then
          echo -e "  VS Code Tunnel: ${GREEN}$(cat ~/.board/tunnel-url)${NC}"
          echo "    Open this URL in any browser. Sign in with GitHub."
      fi
      if systemctl is-active --quiet code-server@devuser 2>/dev/null; then
          echo "  code-server:    http://localhost:8080 (via SSH tunnel)"
      fi
      if systemctl is-active --quiet cockpit.socket 2>/dev/null; then
          echo "  Cockpit:        http://localhost:9091 (via SSH tunnel on port 9190, login: devuser / board)"
      fi
      if docker inspect --format='{{.State.Running}}' portainer 2>/dev/null | grep -q true; then
          echo "  Portainer:      http://localhost:9000 (pwd: $(cat ~/.portainer-password 2>/dev/null || echo 'see ~/.portainer-password'))"
      fi
      echo ""

      # ── Signal completion (for VS Code extension first-run detection) ──
      touch ~/.setup-me-complete

      # ── Done ──
      echo -e "${BLUE}${BOLD}╭───────────────────────────────────────────────╮${NC}"
      if [[ -d ~/projects/.board ]]; then
          echo -e "${BLUE}${BOLD}│  Setup complete. You're ready to code.        │${NC}"
          echo -e "${BLUE}${BOLD}│  Run 'check' to verify services.             │${NC}"
      else
          echo -e "${BLUE}${BOLD}│  Setup complete. You're ready to code.        │${NC}"
          echo -e "${BLUE}${BOLD}│                                               │${NC}"
          echo -e "${BLUE}${BOLD}│  Next: cd ~/projects && git clone <your-repo> │${NC}"
      fi
      echo -e "${BLUE}${BOLD}╰───────────────────────────────────────────────╯${NC}"
      echo ""

  - path: /etc/update-motd.d/50-board
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Board dynamic MOTD — must render in <500ms
      # Reads cached health check results, never runs live checks

      bold=$'\033[1m'
      dim=$'\033[2m'
      green=$'\033[32m'
      red=$'\033[31m'
      sky=$'\033[38;2;14;165;233m'
      reset=$'\033[0m'

      # Read board config
      BOARD_NAME="board"
      BOARD_REGION=""
      BOARD_SIZE=""
      if [[ -f /home/devuser/.board/config ]]; then
          source /home/devuser/.board/config 2>/dev/null
      fi

      # Read last check results
      TOTAL=0; PASSED=0; FAILED=0; LAST_CHECK=""
      if [[ -f /home/devuser/.board/last-check ]]; then
          source /home/devuser/.board/last-check 2>/dev/null
          LAST_CHECK="$TIMESTAMP"
      fi

      # Disk info
      DISK_PCT=$(df / --output=pcent 2>/dev/null | tail -1 | tr -d ' %' || echo "?")
      DISK_FREE=$(df -h / --output=avail 2>/dev/null | tail -1 | tr -d ' ' || echo "?")

      # Uptime
      UPTIME=$(uptime -p 2>/dev/null | sed 's/^up //' || echo "unknown")

      echo ""
      echo "  ${sky}┌──────────────────────────────────────────────┐${reset}"
      echo "  ${sky}│${reset}  ${bold}${BOARD_NAME}${reset}  │  ${dim}${BOARD_REGION}${reset}  │  ${dim}${BOARD_SIZE}${reset}     ${sky}│${reset}"
      echo "  ${sky}└──────────────────────────────────────────────┘${reset}"
      echo ""

      # Health summary
      if (( TOTAL > 0 )); then
          if (( FAILED == 0 )); then
              echo "  ${bold}Health${reset}        ${green}${PASSED}/${TOTAL} passed${reset}"
          else
              echo "  ${bold}Health${reset}        ${red}${FAILED} issue(s)${reset} (${PASSED}/${TOTAL} passed)"
          fi
      fi

      echo "  ${bold}Uptime${reset}        ${UPTIME}"
      echo "  ${bold}Disk${reset}          ${DISK_PCT}% used (${DISK_FREE} free)"
      echo ""
      echo "  ${dim}check${reset}           run health checks"
      echo "  ${dim}board-help${reset}      show all commands"
      echo "  ${dim}forward-ports${reset}   show listening ports + SSH tunnel command"
      if [[ -f /home/devuser/.board/tunnel-url ]]; then
          echo "  ${dim}tunnel${reset}          $(cat /home/devuser/.board/tunnel-url)"
      fi
      echo ""
      echo "  ${dim}board v1.0.0${reset}"
      echo ""

  - path: /home/devuser/.board/config
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      # Board configuration — populated during provisioning
      BOARD_NAME="board"
      BOARD_REGION=""
      BOARD_SIZE=""

  - path: /home/devuser/.board/is-idle.sh
    owner: devuser:devuser
    permissions: "0755"
    defer: true
    content: |
      #!/usr/bin/env bash
      # Board idle detection — exits 0 if idle, 1 if active
      # Used by auto-shutdown (future) to avoid shutting down during active work

      is_active_ssh() {
          # Check for active SSH sessions (pts = pseudo terminal = SSH)
          who | grep -q "pts/"
      }

      is_active_codeserver() {
          # Check for established WebSocket connections to code-server
          ss -tn state established '( dport = :8080 )' 2>/dev/null | grep -q ESTAB
      }

      is_active_tunnel() {
          # Check if a VS Code Tunnel client is connected
          # The tunnel service status includes connection timestamps
          systemctl --user is-active --quiet code-tunnel 2>/dev/null && \
              /usr/local/bin/code tunnel status 2>&1 | grep -q "last_connected_at"
      }

      if is_active_ssh || is_active_codeserver || is_active_tunnel; then
          exit 1  # Active — do not shut down
      fi
      exit 0  # Idle — safe to shut down

  - path: /home/devuser/.board/shutdown-config
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      # Board auto-shutdown configuration — values baked from policy at deploy time
      SHUTDOWN_START_HOUR=__SHUTDOWN_START_HOUR__
      SHUTDOWN_BACKSTOP_HOUR=__SHUTDOWN_BACKSTOP_HOUR__

  - path: /home/devuser/.board/idle-shutdown.sh
    owner: devuser:devuser
    permissions: "0755"
    defer: true
    content: |
      #!/usr/bin/env bash
      # Board idle-aware shutdown — called by systemd timer.
      # Checks is-idle.sh; if idle, gracefully powers off after a 60 s warning.
      # DevTestLab backstop handles deallocation at SHUTDOWN_BACKSTOP_HOUR.
      set -euo pipefail

      CONFIG="/home/devuser/.board/shutdown-config"
      TAG="board-idle-shutdown"

      if [[ ! -f "$CONFIG" ]]; then
          logger -t "$TAG" "No config at $CONFIG — skipping"
          exit 0
      fi
      # shellcheck source=/dev/null
      source "$CONFIG"

      SHUTDOWN_START_HOUR="${SHUTDOWN_START_HOUR:-19}"
      SHUTDOWN_BACKSTOP_HOUR="${SHUTDOWN_BACKSTOP_HOUR:-22}"

      HOUR=$(date +%-H)

      # Outside shutdown window — do nothing
      if (( HOUR < SHUTDOWN_START_HOUR )); then
          exit 0
      fi

      # Past backstop — force shutdown regardless of activity
      if (( HOUR >= SHUTDOWN_BACKSTOP_HOUR )); then
          logger -t "$TAG" "Backstop hour reached (${SHUTDOWN_BACKSTOP_HOUR}:00). Forcing shutdown."
          wall "Board: Hard shutdown cutoff reached. Shutting down in 60 seconds."
          sleep 60
          sudo /sbin/poweroff
          exit 0
      fi

      # Within window — check idle status
      if /home/devuser/.board/is-idle.sh; then
          logger -t "$TAG" "VM is idle during shutdown window. Starting 60 s grace period."
          wall "Board: VM is idle. Auto-shutting down in 60 seconds. Connect to cancel."
          sleep 60

          # Re-check — developer may have connected during grace period
          if /home/devuser/.board/is-idle.sh; then
              logger -t "$TAG" "Still idle after grace period. Powering off."
              sudo /sbin/poweroff
          else
              logger -t "$TAG" "Activity detected during grace period. Shutdown cancelled."
          fi
      else
          logger -t "$TAG" "VM is active. Deferring shutdown."
      fi

  - path: /home/devuser/.config/systemd/user/board-idle-shutdown.service
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Board idle-aware shutdown check
      [Service]
      Type=oneshot
      ExecStart=/bin/bash /home/devuser/.board/idle-shutdown.sh

  - path: /home/devuser/.config/systemd/user/board-idle-shutdown.timer
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Check for idle shutdown every 15 minutes during shutdown window
      [Timer]
      OnCalendar=*-*-* 19,20,21:00/15
      Persistent=true
      [Install]
      WantedBy=timers.target

  - path: /home/devuser/.board/forward-ports.sh
    owner: devuser:devuser
    permissions: "0755"
    defer: true
    content: |
      #!/usr/bin/env bash
      # Discover all listening TCP ports and print an SSH tunnel command.
      # Usage: run on the VM, copy the output, paste on your local machine.

      bold=$'\033[1m'
      dim=$'\033[2m'
      reset=$'\033[0m'

      HOSTNAME=$(hostname)

      # Collect unique ports listening on localhost or all interfaces, exclude SSH (22) and ephemeral (>32767)
      PORTS=$(ss -tlnH 2>/dev/null \
        | awk '{print $4}' \
        | grep -oP '(?:127\.0\.0\.1|0\.0\.0\.0|\[::\]|localhost):?\K\d+' \
        | sort -un \
        | awk '$1 <= 32767 && $1 != 22')

      if [ -z "$PORTS" ]; then
          echo "No services listening."
          exit 0
      fi

      echo ""
      echo "${bold}Listening ports on ${HOSTNAME}${reset}"
      echo ""

      # Show what's on each port
      while IFS= read -r port; do
          proc=$(ss -tlnpH 2>/dev/null | grep ":${port} " | head -1 | grep -oP 'users:\(\("\K[^"]+' || echo "unknown")
          printf "  %s%-5s%s  %s\n" "$bold" "$port" "$reset" "$proc"
      done <<< "$PORTS"

      echo ""
      echo "${bold}SSH tunnel command (run from your local machine):${reset}"
      echo ""

      CMD="ssh"
      while IFS= read -r port; do
          CMD="$CMD -L ${port}:localhost:${port}"
      done <<< "$PORTS"
      CMD="$CMD $HOSTNAME"

      echo "  $CMD"
      echo ""

  - path: /home/devuser/.config/systemd/user/board-check.service
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Board health check (cache refresh)
      [Service]
      Type=oneshot
      ExecStart=/bin/bash /home/devuser/projects/.board/check.sh

  - path: /home/devuser/.config/systemd/user/board-check.timer
    owner: devuser:devuser
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Run board health check every 10 minutes
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=10min
      [Install]
      WantedBy=timers.target

runcmd:
  # ── Fix ownership of home directory and subdirectories ──
  - chown devuser:devuser /home/devuser
  - mkdir -p /home/devuser/.board /home/devuser/.config
  - chown -R devuser:devuser /home/devuser/.board
  - chown -R devuser:devuser /home/devuser/.config

  # ── Docker: add repo and install ──
  # Note: apt-get uses DPkg::Lock::Timeout to wait for locks held by
  # unattended-upgrades or other apt processes that run on first boot.
  - |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
      > /etc/apt/sources.list.d/docker.list
    apt-get -o DPkg::Lock::Timeout=120 update
    apt-get -o DPkg::Lock::Timeout=120 install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    usermod -aG docker devuser
    echo "devuser:$(openssl rand -base64 24)" | chpasswd

  # ── Docker socket: open to all local users (single-purpose dev VM) ──
  # Entra ID users aren't in the docker group on first login, and group
  # membership requires re-login to take effect. 0666 is fine here —
  # the VM is single-purpose and the socket is not network-exposed.
  - mkdir -p /etc/systemd/system/docker.service.d
  - |
    cat > /etc/systemd/system/docker.service.d/socket-permissions.conf << 'DOCKERPERM'
    [Service]
    ExecStartPost=/bin/chmod 0666 /var/run/docker.sock
    DOCKERPERM
  - systemctl daemon-reload
  - systemctl restart docker

  # ── Cockpit: override socket to localhost-only on port 9190 ──
  # Default 9090 conflicts with common dev tools (minio, Prometheus, etc), so we use 9190.
  - mkdir -p /etc/systemd/system/cockpit.socket.d
  - |
    cat > /etc/systemd/system/cockpit.socket.d/listen-localhost.conf << 'COCKPITOVERRIDE'
    [Socket]
    ListenStream=
    ListenStream=127.0.0.1:9190
    COCKPITOVERRIDE
  - systemctl daemon-reload
  # Cockpit's package install auto-starts the socket with the default config (all interfaces).
  # After writing our localhost-only drop-in above, we must restart (not just enable) so systemd
  # picks up the new ListenStream. enable --now is a no-op if already running.
  - systemctl enable cockpit.socket
  - 'systemctl restart cockpit.socket || echo "[board] WARN: cockpit.socket failed to start (non-fatal)"'
  # Remove Cockpit's default MOTD/issue lines — our custom MOTD already shows correct SSH-tunnel instructions
  - rm -f /etc/motd.d/cockpit /etc/issue.d/cockpit.issue

  # ── Portainer CE: Docker management UI on localhost:9443 ──
  - systemctl is-active --wait docker
  - |
    # Generate a unique random admin password for this VM
    PORTAINER_PWD=$(openssl rand -base64 18 | tr -d '=/+' | head -c 16)
    echo "$PORTAINER_PWD" > /home/devuser/.portainer-password
    chown devuser:devuser /home/devuser/.portainer-password
    chmod 400 /home/devuser/.portainer-password
    PORTAINER_HASH=$(htpasswd -nbBC 10 admin "$PORTAINER_PWD" | cut -d: -f2)
    sudo -u devuser docker run -d \
      --name portainer \
      --restart unless-stopped \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v portainer_data:/data \
      -p 127.0.0.1:9000:9000 \
      -p 127.0.0.1:9443:9443 \
      portainer/portainer-ce:lts \
      --admin-password "$PORTAINER_HASH" \
      || echo "[board] WARN: Portainer start failed (non-fatal)"

  # ── Enable systemd user services without login (for persistent dev services) ──
  - loginctl enable-linger devuser

  # ── Node.js 22: add repo and install ──
  - |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
      | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
      > /etc/apt/sources.list.d/nodesource.list
    apt-get -o DPkg::Lock::Timeout=120 update
    apt-get -o DPkg::Lock::Timeout=120 install -y nodejs

  # ── pnpm via corepack (pinned to match surf-kit packageManager field) ──
  - corepack enable
  - corepack prepare pnpm@10.33.0 --activate

  # ── Python: install from deadsnakes if not already 3.12+ ──
  - add-apt-repository -y ppa:deadsnakes/ppa
  - apt-get -o DPkg::Lock::Timeout=120 update
  - apt-get -o DPkg::Lock::Timeout=120 install -y python3.12 python3.12-venv python3.12-dev
  - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1

  # ── uv: Python package manager ──
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - cp /root/.local/bin/uv /usr/local/bin/uv
  - cp /root/.local/bin/uvx /usr/local/bin/uvx

  # ── Azure CLI ──
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  # ── just (task runner) ──
  - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

  # ── GitHub CLI ──
  - |
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | tee /etc/apt/sources.list.d/github-cli.list
    apt-get -o DPkg::Lock::Timeout=120 update
    apt-get -o DPkg::Lock::Timeout=120 install -y gh

  # ── GitHub Copilot CLI extension (best-effort — requires gh auth, installed properly in setup-me.sh step 3) ──
  - su - devuser -c "gh extension install github/gh-copilot 2>/dev/null || true"

  # ── yq (YAML parser for provisioning engine) ──
  - |
    wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    chmod +x /usr/local/bin/yq

  # ── code-server (browser IDE) ──
  - |
    echo "[board] Installing code-server..."
    export HOME=/root
    CODESERVER_VERSION="4.96.4"
    curl -fsSL https://code-server.dev/install.sh | sh -s -- --version "$CODESERVER_VERSION" 2>&1 || {
      echo "[board] WARN: code-server install failed (non-fatal)"
    }
  - |
    mkdir -p /home/devuser/.config/code-server
    cat > /home/devuser/.config/code-server/config.yaml << CSCONF
    bind-addr: 127.0.0.1:8080
    auth: none
    cert: false
    CSCONF
    chown -R devuser:devuser /home/devuser/.config/code-server
    # Override systemd unit to open the projects directory by default
    mkdir -p /etc/systemd/system/code-server@devuser.service.d
    cat > /etc/systemd/system/code-server@devuser.service.d/default-folder.conf << OVERRIDE
    [Service]
    ExecStart=
    ExecStart=/usr/bin/code-server --bind-addr 127.0.0.1:8080 /home/devuser/projects
    OVERRIDE
    systemctl daemon-reload
  - 'systemctl enable --now code-server@devuser || echo "[board] WARN: code-server service failed to start (non-fatal)"'

  # ── VS Code CLI (for tunnels) ──
  - |
    ARCH=$(dpkg --print-architecture)
    case "$ARCH" in
      amd64) CLI_PLATFORM="cli-linux-x64" ;;
      arm64) CLI_PLATFORM="cli-linux-arm64" ;;
      *)     echo "[board] WARN: Unsupported arch for VS Code CLI: $ARCH"; exit 0 ;;
    esac
    echo "[board] Installing VS Code CLI (${CLI_PLATFORM})..."
    curl -fsSL "https://update.code.visualstudio.com/latest/${CLI_PLATFORM}/stable" \
      --output /tmp/vscode_cli.tar.gz && \
    tar -xf /tmp/vscode_cli.tar.gz -C /usr/local/bin/ && \
    rm -f /tmp/vscode_cli.tar.gz && \
    chmod +x /usr/local/bin/code && \
    echo "[board] VS Code CLI installed: $(/usr/local/bin/code version 2>/dev/null || echo 'unknown')" || {
      echo "[board] WARN: VS Code CLI install failed (non-fatal)"
    }

  # ── Disable default Ubuntu MOTD noise, keep custom Board MOTD ──
  - chmod -x /etc/update-motd.d/*
  - chmod +x /etc/update-motd.d/50-board
  - echo "" > /etc/motd

  # ── SSH hardening ──
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#*X11Forwarding.*/X11Forwarding no/' /etc/ssh/sshd_config
  - sed -i 's/^#*MaxAuthTries.*/MaxAuthTries 6/' /etc/ssh/sshd_config
  - sed -i 's/^#*ClientAliveInterval.*/ClientAliveInterval 300/' /etc/ssh/sshd_config
  - sed -i 's/^#*ClientAliveCountMax.*/ClientAliveCountMax 2/' /etc/ssh/sshd_config
  - systemctl restart ssh

  # ── Entra ID (AAD) user access to devuser home ──
  - |
    cat > /etc/profile.d/board-entra-acl.sh << 'ENTRA_ACL'
    # One-shot: grant aad_admins group access to devuser home on first AAD login
    if getent group aad_admins >/dev/null 2>&1; then
      MARKER="/home/devuser/.board/.acl-applied"
      if [ ! -f "$MARKER" ]; then
        sudo setfacl -R -m g:aad_admins:rwX /home/devuser 2>/dev/null
        sudo setfacl -R -d -m g:aad_admins:rwX /home/devuser 2>/dev/null
        sudo usermod -aG docker "$(whoami)" 2>/dev/null
        sudo mkdir -p /home/devuser/.board 2>/dev/null
        sudo touch "$MARKER" 2>/dev/null
      fi
    fi
    ENTRA_ACL

  # ── Entra users: redirect to devuser workspace ──
  # /etc/bash.bashrc runs for all interactive shells (including VS Code terminals)
  - |
    cat >> /etc/bash.bashrc << 'ENTRA_REDIRECT'

    # Board: Entra ID users work in devuser's home, not their own
    if [ "$HOME" != "/home/devuser" ] && id -nG 2>/dev/null | grep -qw aad_admins; then
      export PATH="/home/devuser/.local/bin:$PATH"
      export BOARD_USER="devuser"
      cd /home/devuser/projects 2>/dev/null || true
    fi
    ENTRA_REDIRECT

  # ── Create dev workspace ──
  - mkdir -p /home/devuser/projects
  - chown devuser:devuser /home/devuser/projects

  # ── tmux configuration ──
  - |
    cat > /home/devuser/.tmux.conf << 'TMUX'
    # ── Mouse support (click panes, resize, scroll) ──
    set -g mouse on

    # ── Start window numbering at 1 (matches keyboard layout) ──
    set -g base-index 1
    setw -g pane-base-index 1

    # ── Increase scrollback buffer ──
    set -g history-limit 10000

    # ── Status bar ──
    set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
    set -g status-left ' #[fg=#89b4fa,bold]#S #[default]│ '
    set -g status-right ' #[fg=#a6adc8]%H:%M  %d %b #[default]│ #[fg=#89b4fa]#H '
    set -g status-left-length 30
    set -g status-right-length 40

    # ── Window status ──
    setw -g window-status-format ' #I:#W '
    setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W '

    # ── Pane borders ──
    set -g pane-border-style 'fg=#45475a'
    set -g pane-active-border-style 'fg=#89b4fa'

    # ── Quality of life ──
    set -g renumber-windows on
    set -s escape-time 0
    set -g default-terminal "tmux-256color"

    # ── Split panes with | and - (more intuitive than % and ") ──
    bind | split-window -h -c "#{pane_current_path}"
    bind - split-window -v -c "#{pane_current_path}"

    # ── Reload config ──
    bind r source-file ~/.tmux.conf \; display "Config reloaded"
    TMUX
    chown devuser:devuser /home/devuser/.tmux.conf

  # ── Sample project (hello-board) ──
  - mkdir -p /home/devuser/projects/hello-board/.devcontainer
  - |
    cat > /home/devuser/projects/hello-board/docker-compose.yml << 'COMPOSE'
    services:
      api:
        build: .
        ports:
          - "8000:8000"
        volumes:
          - .:/app
    COMPOSE
  - |
    cat > /home/devuser/projects/hello-board/Dockerfile << 'DOCKERFILE'
    FROM python:3.12-slim
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    DOCKERFILE
  - |
    cat > /home/devuser/projects/hello-board/requirements.txt << 'REQS'
    fastapi==0.135.2
    uvicorn[standard]==0.42.0
    REQS
  - |
    cat > /home/devuser/projects/hello-board/main.py << 'MAIN'
    from fastapi import FastAPI
    import platform

    app = FastAPI(title="Hello Board")

    @app.get("/")
    def root():
        return {
            "message": "Your board is working.",
            "hostname": platform.node(),
            "python": platform.python_version(),
            "tip": "Edit main.py — the server reloads automatically."
        }

    @app.get("/health")
    def health():
        return {"status": "ok"}
    MAIN
  - |
    cat > /home/devuser/projects/hello-board/README.md << 'README'
    # Hello Board

    A sample project to verify your development environment works.

    ## Quick start

    ```bash
    cd ~/projects/hello-board
    docker compose up --build
    ```

    Then open http://localhost:8000 in your browser.
    (If you're connected via VS Code Remote SSH, port forwarding happens automatically.)

    ## What to try

    1. Edit `main.py` — change the message, save, and refresh the browser.
       The server reloads automatically.
    2. Visit http://localhost:8000/docs to see the auto-generated API documentation.
    3. When you're done: `docker compose down`

    ## This is a throwaway project

    Delete it whenever you want: `rm -rf ~/projects/hello-board`
    README
  - |
    cat > /home/devuser/projects/hello-board/.devcontainer/devcontainer.json << 'DEVCONTAINER'
    {
      "name": "Hello Board",
      "dockerComposeFile": "../docker-compose.yml",
      "service": "api",
      "workspaceFolder": "/app",
      "customizations": {
        "vscode": {
          "extensions": [
            "ms-python.python",
            "ms-python.vscode-pylance"
          ],
          "settings": {
            "python.defaultInterpreterPath": "/usr/local/bin/python"
          }
        }
      },
      "forwardPorts": [8000]
    }
    DEVCONTAINER
  - chown -R devuser:devuser /home/devuser/projects/hello-board

  # ── Pre-pull Docker image for sample project ──
  - docker pull python:3.12-slim

  # ── Bash profile for devuser ──
  - |
    cat >> /home/devuser/.bashrc << 'BASHRC'

    # ── Board environment ──
    export EDITOR=nvim
    export PATH="$HOME/.local/bin:$PATH"

    # Prompt: user@vm-name:~/path (git-branch)$
    parse_git_branch() {
      git branch 2>/dev/null | sed -e '/^[^*]/d' -e 's/* \(.*\)/ (\1)/'
    }
    export PS1='\[\e[1;32m\]\u@\h\[\e[0m\]:\[\e[1;34m\]\w\[\e[0;33m\]$(parse_git_branch)\[\e[0m\]\$ '

    # Aliases
    alias ll='ls -alF'
    alias gs='git status'
    alias gd='git diff'
    alias gl='git log --oneline -20'
    alias dc='docker compose'
    alias k='kubectl'

    # ── Familiar aliases (PowerShell/CMD equivalents) ──
    alias cls='clear'
    alias dir='ls -la'
    alias copy='cp'
    alias move='mv'
    alias del='rm'
    alias type='cat'
    alias md='mkdir -p'
    alias rd='rmdir'
    alias where='which'
    alias findstr='grep'
    alias notepad='nvim'
    alias forward-ports='~/.board/forward-ports.sh'

    # Help command
    board-help() {
      echo '
      Board Quick Reference
      =====================

      Health & Status
        check              run all health checks
        board-help         show this reference
        forward-ports      show all listening ports + SSH tunnel command

      Services
        Ctrl+Shift+P in VS Code -> "Run Task" for project tasks, or:
        systemctl --user restart <service>    restart a service
        journalctl --user -u <service> -f     stream service logs

      Browser Tools (auto-forwarded by VS Code, or use forward-ports)
        code-server    http://localhost:8080   browser IDE
        cockpit        http://localhost:9091   system admin, logs, files
        portainer      http://localhost:9000   Docker management (pwd in ~/.portainer-password)

      Git
        gs                     git status
        gd                     git diff
        gl                     git log --oneline -20
        git clone <url>        Clone a repo

      Docker
        dc up                  docker compose up
        dc down                docker compose down
        dc logs -f             Follow container logs
        dc ps                  List running containers

      Projects
        ~/projects/        your project workspace

      Need help? Message your admin or check the docs.
      '
    }

    # Docker: buildkit by default
    export DOCKER_BUILDKIT=1
    export COMPOSE_DOCKER_CLI_BUILD=1

    cd ~/projects 2>/dev/null || true
    BASHRC

  # ── Git default config ──
  - su - devuser -c "git config --global init.defaultBranch main"
  - su - devuser -c "git config --global pull.rebase true"
  - su - devuser -c "git config --global core.editor nvim"
  - su - devuser -c "git config --global push.autoSetupRemote true"

  # ── Enable board health check timer ──
  - su - devuser -c "mkdir -p ~/.config/systemd/user && systemctl --user daemon-reload && systemctl --user enable --now board-check.timer" || true

  # ── Idle-aware shutdown: passwordless poweroff for devuser ──
  - echo "devuser ALL=(ALL) NOPASSWD: /sbin/poweroff" > /etc/sudoers.d/board-idle-shutdown
  - chmod 440 /etc/sudoers.d/board-idle-shutdown

  # ── Enable idle shutdown timer ──
  - su - devuser -c "systemctl --user enable --now board-idle-shutdown.timer" || true

  # ── Signal completion ──
  - touch /home/devuser/.cloud-init-complete
  - chown devuser:devuser /home/devuser/.cloud-init-complete

final_message: "Cloud-init complete. System ready for development."
