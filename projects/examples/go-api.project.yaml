# projects/examples/go-api.project.yaml

name: go-api
description: Go microservice (Go 1.22 + Postgres + gRPC + HTTP)
repo: https://github.com/your-org/go-api
path: ~/projects/go-api

# ── System requirements (validated before provisioning) ──
requires:
  tools: [go, docker, protoc]
  cloud_init: true

# ── Dependency installation (idempotent commands) ──
install:
  - label: Download Go modules
    run: go mod download
  - label: Install tools
    run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest && go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
  - label: Generate protobuf code
    run: make proto
  - label: Build binary
    run: go build -o bin/api ./cmd/api

# ── Docker services (managed via docker compose) ──
docker:
  compose_file: docker-compose.yml
  containers:
    - name: go-postgres
      restart_policy: unless-stopped
      health_cmd: pg_isready -U goapi -d goapi
      health_interval: 2
      health_timeout: 60

# ── Post-docker setup (runs after containers are healthy) ──
post_docker:
  - label: Run database migrations
    run: go run ./cmd/migrate up

# ── Long-running app services (systemd user units) ──
services:
  - name: go-api-http
    description: Go HTTP API server
    exec: bin/api serve --http-addr=:8080 --grpc-addr=:50051
    working_dir: .
    env_file: .env
    health_url: http://localhost:8080/healthz
    health_timeout: 10

# ── Environment variables ──
env:
  file: .env
  fallback: .env.example

  keyvault_secrets:
    JWT_SIGNING_KEY: jwt-signing-key
    OTEL_EXPORTER_ENDPOINT: otel-exporter-endpoint

  hardcoded:
    DATABASE_URL: postgres://goapi:localdev@localhost:5432/goapi?sslmode=disable
    HTTP_ADDR: ":8080"
    GRPC_ADDR: ":50051"
    LOG_LEVEL: debug
    LOG_FORMAT: text
    ENVIRONMENT: development
    OTEL_SERVICE_NAME: go-api

  required:
    - DATABASE_URL

# ── VS Code integration ──
vscode:
  ports:
    "8080": { label: "HTTP API", auto_forward: notify }
    "50051": { label: "gRPC", auto_forward: silent }
    "5432": { label: "Postgres", auto_forward: silent }

  tasks:
    - label: Build
      command: go build -o bin/api ./cmd/api
      group: build
    - label: Restart API
      command: go build -o bin/api ./cmd/api && systemctl --user restart go-api-http && echo 'API rebuilt and restarted'
    - label: View Logs
      command: journalctl --user -u go-api-http -f --no-hostname -o cat
      background: true
    - label: Run Migrations
      command: go run ./cmd/migrate up
    - label: Run Tests
      command: go test ./...
    - label: Generate Protobuf
      command: make proto
    - label: Health Check
      command: check
    - label: Postgres Shell
      command: docker exec -it go-postgres psql -U goapi -d goapi
    - label: gRPC Test
      command: grpcurl -plaintext localhost:50051 list
    - label: Stop API
      command: systemctl --user stop go-api-http && echo 'API stopped (ports 8080/50051 free for debugger)'

  launch:
    - name: Debug Go API
      type: go
      request: launch
      mode: auto
      program: ./cmd/api
      args: ["serve", "--http-addr=:8080", "--grpc-addr=:50051"]
      cwd: .
      envFile: .env
      pre_launch_task: Stop API

  settings:
    go.goroot: /usr/local/go
    go.lintTool: golangci-lint

# ── Health checks (used by `check` command and smoke tests) ──
health:
  - label: Postgres
    check: docker exec go-postgres pg_isready -U goapi -d goapi
    port: 5432
  - label: HTTP API
    check: curl -sf http://localhost:8080/healthz
    port: 8080
  - label: gRPC API
    check: grpcurl -plaintext localhost:50051 grpc.health.v1.Health/Check 2>/dev/null || nc -z localhost 50051
    port: 50051
  - label: Database migrations
    check: go run ./cmd/migrate status 2>&1 | grep -q "up to date"
