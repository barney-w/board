# projects/surf-kit.project.yaml

name: surf-kit
description: Component library (React/pnpm)
repo:
  url: https://github.com/barney-w/surf-kit-atlas.git
  ref: feat/atlas-reskin
  auth:
    type: github-token
    keyvault_secret: github-atlas-bootstrap-token
    env_var: ATLAS_GITHUB_TOKEN
    persist: false
path: ~/projects/surf-kit

requires:
  tools: [node, pnpm]
  cloud_init: true

install:
  - label: Install dependencies
    run: pnpm install
  - label: Build library
    run: pnpm run build

# ── Dev workflow ──
dev:
  run: pnpm run dev
  description: Dev server with hot reload

vscode:
  ports:
    "5173": { label: "surf-kit dev server", auto_forward: notify }

  tasks:
    - label: Dev Server
      command: pnpm run dev
      background: true
    - label: Build
      command: pnpm run build
      group: build
    - label: Lint
      command: pnpm run lint
    - label: Type Check
      command: pnpm run typecheck

  settings:
    typescript.tsdk: ./node_modules/typescript/lib

# ── Workspace panes (used by myterm to generate surf layout) ──
workspace:
  services:
    - name: surf-kit Dev
      command: pnpm run dev

health:
  - label: Dependencies
    check: test -d node_modules
  - label: Build
    check: test -d packages/core/dist
