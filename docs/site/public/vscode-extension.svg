<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .status-dot { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Window frame -->
  <rect width="680" height="200" rx="12" fill="#1e1e1e"/>

  <!-- Title bar -->
  <path d="M0,12 Q0,0 12,0 L668,0 Q680,0 680,12 L680,32 L0,32 Z" fill="#2d2d2d"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="50" cy="16" r="5" fill="#28c840"/>
  <text x="340" y="20" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8c8c8c">Board — VS Code Extension</text>

  <!-- Activity bar -->
  <rect x="0" y="32" width="40" height="138" fill="#252526"/>
  <rect x="0" y="32" width="2" height="28" fill="#0ea5e9" rx="1"/>
  <rect x="10" y="40" width="20" height="20" rx="5" fill="#0ea5e9" opacity="0.12"/>
  <text x="20" y="55" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0ea5e9">B</text>

  <!-- Command palette items -->
  <!-- Item 1: Import Pass -->
  <rect x="52" y="44" width="614" height="32" rx="4" fill="#2a2d36"/>
  <rect x="52" y="44" width="3" height="32" rx="1" fill="#0ea5e9" opacity="0.6"/>
  <text x="70" y="65" font-size="13">
    <tspan fill="#569cd6">&gt;</tspan>
    <tspan fill="#dcdcaa"> Board: Import Pass</tspan>
  </text>
  <text x="652" y="65" text-anchor="end"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6a737d">decrypt .board-pass — auto-configure SSH</text>

  <!-- Item 2: Connect -->
  <rect x="52" y="84" width="614" height="32" rx="4" fill="#2a2d36"/>
  <rect x="52" y="84" width="3" height="32" rx="1" fill="#8b5cf6" opacity="0.6"/>
  <text x="70" y="105" font-size="13">
    <tspan fill="#569cd6">&gt;</tspan>
    <tspan fill="#dcdcaa"> Board: Connect</tspan>
  </text>
  <text x="652" y="105" text-anchor="end"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6a737d">one-click SSH tunnel + port forwarding</text>

  <!-- Item 3: Health Check -->
  <rect x="52" y="124" width="614" height="32" rx="4" fill="#2a2d36"/>
  <rect x="52" y="124" width="3" height="32" rx="1" fill="#10b981" opacity="0.6"/>
  <text x="70" y="145" font-size="13">
    <tspan fill="#569cd6">&gt;</tspan>
    <tspan fill="#dcdcaa"> Board: Health Check</tspan>
  </text>
  <text x="652" y="145" text-anchor="end"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6a737d">verify services, ports, and dependencies</text>

  <!-- Status bar -->
  <path d="M0,170 L680,170 L680,188 Q680,200 668,200 L12,200 Q0,200 0,188 Z" fill="#0ea5e9"/>
  <circle cx="16" cy="185" r="3.5" fill="#fff" class="status-dot"/>
  <text x="28" y="189"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#fff">Board: alice-dev</text>
  <text x="152" y="189"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.7)">connected</text>
  <text x="664" y="189" text-anchor="end"
        font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.7)">↔ 3 ports forwarded</text>
</svg>
